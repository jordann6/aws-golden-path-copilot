<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Golden-Path FinOps Copilot</title>
<style>
  :root { --bg:#0f1116; --card:#181b22; --line:#262a33; --fg:#e6e8ec; --mut:#9aa0aa;
          --ok:#3fb950; --warn:#d29922; --bad:#f85149; --acc:#58a6ff; }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.5 -apple-system,Segoe UI,Roboto,sans-serif;
         background:var(--bg); color:var(--fg); }
  header { padding:20px 24px; border-bottom:1px solid var(--line); }
  header h1 { margin:0; font-size:18px; }
  header p { margin:4px 0 0; color:var(--mut); font-size:13px; }
  main { max-width:820px; margin:0 auto; padding:24px; }
  .row { display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; }
  input, select, textarea, button { font:inherit; border-radius:8px;
    border:1px solid var(--line); background:var(--card); color:var(--fg); padding:10px 12px; }
  textarea { flex:1 1 100%; min-height:64px; resize:vertical; }
  select { min-width:130px; }
  button { background:var(--acc); color:#08111f; border:none; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  label.chk { color:var(--mut); display:flex; align-items:center; gap:6px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px;
          padding:18px 20px; margin-top:16px; }
  .kv { display:grid; grid-template-columns:96px 1fr; gap:4px 12px; margin:10px 0; }
  .kv dt { color:var(--mut); } .kv dd { margin:0; }
  .badge { display:inline-block; padding:1px 8px; border-radius:20px; font-size:12px; font-weight:600; }
  .ok{background:rgba(63,185,80,.15);color:var(--ok);}
  .warn{background:rgba(210,153,34,.15);color:var(--warn);}
  .over,.blocked{background:rgba(248,81,73,.15);color:var(--bad);}
  ul { margin:6px 0; padding-left:18px; } li { margin:2px 0; }
  h3 { margin:16px 0 4px; font-size:13px; text-transform:uppercase; letter-spacing:.04em; color:var(--mut); }
  .cost { font-size:22px; font-weight:700; }
  .alt { color:var(--warn); font-style:italic; }
  code { background:#0b0d12; padding:1px 5px; border-radius:4px; }
</style>
</head>
<body>
<header>
  <h1>Golden-Path FinOps Copilot</h1>
  <p>Describe a resource. Get a right-sized, budget-checked, policy-gated pull request.</p>
</header>
<main>
  <textarea id="msg" placeholder="e.g. I need a Postgres for a staging service, around 50GB, bursty daytime traffic, not latency critical"></textarea>
  <div class="row">
    <select id="team">
      <option value="checkout">checkout</option>
      <option value="data-eng">data-eng</option>
      <option value="growth">growth</option>
    </select>
    <label class="chk"><input type="checkbox" id="offline" checked> offline (no Bedrock)</label>
    <label class="chk"><input type="checkbox" id="approve"> approval label</label>
    <button id="go">Plan it</button>
  </div>
  <div id="out"></div>
</main>
<script>
const $ = s => document.querySelector(s);
const badge = v => `<span class="badge ${v}">${v.toUpperCase()}</span>`;

async function go() {
  const btn = $("#go"); btn.disabled = true; btn.textContent = "Planning...";
  $("#out").innerHTML = "";
  try {
    const r = await fetch("/api/provision", {
      method:"POST", headers:{"content-type":"application/json"},
      body: JSON.stringify({
        message: $("#msg").value, team: $("#team").value,
        offline: $("#offline").checked, approve: $("#approve").checked,
      }),
    });
    render(await r.json());
  } catch (e) { $("#out").innerHTML = `<div class="card">Error: ${e}</div>`; }
  btn.disabled = false; btn.textContent = "Plan it";
}

function render(d) {
  if (!d.sizing) { $("#out").innerHTML = `<div class="card">${d.final_text||"No plan."}</div>`; return; }
  const s=d.sizing, c=d.cost, b=d.budget, p=d.policy;
  const inst = s.instance_type ? `${s.instance_type} · ${s.storage_gb}GB ${s.storage_class}` : `${s.storage_gb}GB`;
  $("#out").innerHTML = `<div class="card">
    <dl class="kv">
      <dt>module</dt><dd><code>${s.module}</code> (${d.intent.kind}, ${d.intent.environment})</dd>
      <dt>sizing</dt><dd>${inst}</dd>
      <dt>budget</dt><dd>${badge(b.verdict)} ${b.message}</dd>
      <dt>policy</dt><dd>${badge(p.passed?"pass":"blocked")} ${p.engine}${p.violations.map(v=>`<br>&nbsp;&nbsp;• ${v}`).join("")}</dd>
    </dl>
    <div class="cost">~$${c.monthly_usd.toFixed(2)}/mo <span style="font-size:12px;color:var(--mut)">(${c.source})</span></div>
    <h3>Right-sizing rationale</h3>
    <ul>${s.rationale.map(x=>`<li>${x}</li>`).join("")}</ul>
    ${s.cheaper_alternative?`<div class="alt">Cheaper option: ${s.cheaper_alternative}</div>`:""}
    <h3>Cost breakdown</h3>
    <ul>${c.breakdown.map(x=>`<li>${x}</li>`).join("")}</ul>
    <h3>Artifacts</h3>
    <ul>${Object.entries(d.outputs).filter(([,v])=>v).map(([k,v])=>`<li>${k}: <code>${v}</code></li>`).join("")}</ul>
  </div>`;
}
$("#go").addEventListener("click", go);
$("#msg").addEventListener("keydown", e => { if (e.metaKey && e.key==="Enter") go(); });
</script>
</body>
</html>
